name: Release Larkite DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as Pre-release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release DMG (macOS ARM64)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Build Larkite.app and Package Larkite.dmg
        run: |
          chmod +x ./build_app.sh ./build_dmg.sh
          ./build_dmg.sh

      - name: Verify DMG Artifact
        run: |
          if [ ! -f "Larkite.dmg" ]; then
            echo "Error: Larkite.dmg was not generated!"
            exit 1
          fi
          ls -lh Larkite.dmg
          shasum -a 256 Larkite.dmg > Larkite.dmg.sha256
          cat Larkite.dmg.sha256

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Larkite-DMG
          path: |
            Larkite.dmg
            Larkite.dmg.sha256

      - name: Determine Prerelease Status
        id: prerelease_check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "is_prerelease=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" =~ (alpha|beta|rc|preview) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Larkite ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            Larkite.dmg
            Larkite.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
