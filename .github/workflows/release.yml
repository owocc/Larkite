name: Release Larkite DMG (Universal & Legacy)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as Pre-release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Universal & Legacy DMGs (Apple Silicon & Intel)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version
          xcrun --show-sdk-version

      - name: Build Modern macOS 26+ / 14+ Universal Package
        run: |
          chmod +x ./build_app.sh ./build_dmg.sh
          echo "==> Packaging Modern Universal DMG (arm64 + x86_64)..."
          ./build_dmg.sh "Larkite-macOS26-Universal.dmg" "14.0"
          cp "Larkite-macOS26-Universal.dmg" "Larkite.dmg"

      - name: Build Legacy macOS 13+ Compatibility Package
        run: |
          echo "==> Packaging Legacy Universal DMG (arm64 + x86_64)..."
          ./build_dmg.sh "Larkite-Legacy-Universal.dmg" "13.0"

      - name: Generate Checksums & Verify Artifacts
        run: |
          ls -lh Larkite*.dmg
          shasum -a 256 Larkite-macOS26-Universal.dmg > Larkite-macOS26-Universal.dmg.sha256
          shasum -a 256 Larkite-Legacy-Universal.dmg > Larkite-Legacy-Universal.dmg.sha256
          shasum -a 256 Larkite.dmg > Larkite.dmg.sha256
          cat *.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Larkite-DMG-Packages
          path: |
            Larkite*.dmg
            *.sha256

      - name: Determine Prerelease Status
        id: prerelease_check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "is_prerelease=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" =~ (alpha|beta|rc|preview) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "Larkite ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            Larkite-macOS26-Universal.dmg
            Larkite-macOS26-Universal.dmg.sha256
            Larkite-Legacy-Universal.dmg
            Larkite-Legacy-Universal.dmg.sha256
            Larkite.dmg
            Larkite.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
