name: Release Larkite DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as Pre-release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  APP_NAME: Larkite

jobs:
  release:
    name: Build & Release Architecture-Specific DMGs (Apple Silicon & Intel)
    # Liquid Glass is enabled for standard AppKit/SwiftUI controls only when
    # the app is linked against the macOS 26 SDK or newer.
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for build number count

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Derive version & build number
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" == "main" ]; then
            VERSION="1.0.0-alpha.2"
          fi
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Building Larkite version $VERSION (build $BUILD_NUMBER)..."

      - name: Verify macOS 26 build toolchain
        run: |
          xcodebuild -version
          swift --version
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Using macOS SDK ${SDK_VERSION}"
          case "${SDK_VERSION}" in
            26.*|27.*) ;;
            *) echo "error: Liquid Glass release builds require macOS SDK 26 or newer" >&2; exit 1 ;;
          esac

      - name: Build Apple Silicon Package (arm64 - macOS 14+)
        run: |
          chmod +x ./build_app.sh ./build_dmg.sh
          echo "==> Building and packaging Apple Silicon (arm64) DMG..."
          ./build_dmg.sh "Larkite-arm64.dmg" "arm64" "14.0"

      - name: Build Intel Mac Package (x86_64 - macOS 13+)
        run: |
          echo "==> Building and packaging Intel Mac (x86_64) DMG..."
          ./build_dmg.sh "Larkite-x86_64.dmg" "x86_64" "13.0"

      - name: Generate Checksums & Verify Artifacts
        run: |
          ls -lh Larkite*.dmg
          vtool -show-build "Larkite.app/Contents/MacOS/Larkite" | grep -Eq 'sdk (26|27)\.'
          shasum -a 256 Larkite-arm64.dmg > Larkite-arm64.dmg.sha256
          shasum -a 256 Larkite-x86_64.dmg > Larkite-x86_64.dmg.sha256
          cat *.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Larkite-DMG-Packages
          path: |
            Larkite*.dmg
            *.sha256

      - name: Create GitHub Release (Native gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" == "main" ]; then
            TAG="v${VERSION}"
          fi
          
          PRERELEASE_FLAG=""
          if [[ "${VERSION}" =~ (alpha|beta|rc|preview) ]] || [[ "${{ inputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          echo "Creating release $TAG ($PRERELEASE_FLAG)..."
          gh release create "$TAG" \
            --title "$APP_NAME $VERSION" \
            --generate-notes \
            $PRERELEASE_FLAG \
            Larkite-arm64.dmg \
            Larkite-arm64.dmg.sha256 \
            Larkite-x86_64.dmg \
            Larkite-x86_64.dmg.sha256
