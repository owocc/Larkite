name: CI Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-verification:
    name: Verify macOS Build
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify macOS 26 build toolchain
        run: |
          xcodebuild -version
          swift --version
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "Using macOS SDK ${SDK_VERSION}"
          case "${SDK_VERSION}" in
            26.*|27.*) ;;
            *) echo "error: Liquid Glass builds require macOS SDK 26 or newer" >&2; exit 1 ;;
          esac

      - name: Build Larkite App Bundle
        run: |
          chmod +x ./build_app.sh
          ./build_app.sh "arm64" "14.0"

      - name: Verify Bundle & Liquid Glass SDK Linkage
        run: |
          test -f "Larkite.app/Contents/MacOS/Larkite"
          test -f "Larkite.app/Contents/Info.plist"
          test -f "Larkite.app/Contents/Resources/AppIcon.icns"
          file "Larkite.app/Contents/MacOS/Larkite" | grep -q "arm64"
          vtool -show-build "Larkite.app/Contents/MacOS/Larkite" | grep -Eq 'sdk (26|27)\.'
          echo "==> Larkite.app arm64 bundle linked against a macOS 26+ SDK successfully verified!"
