name: CI Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-verification:
    name: Verify macOS Build
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Select Xcode Version
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Build Larkite App Bundle
        run: |
          chmod +x ./build_app.sh
          ./build_app.sh

      - name: Verify Bundle & Universal 2 Binary Integrity
        run: |
          test -f "Larkite.app/Contents/MacOS/Larkite"
          test -f "Larkite.app/Contents/Info.plist"
          test -f "Larkite.app/Contents/Resources/AppIcon.icns"
          file "Larkite.app/Contents/MacOS/Larkite" | grep -q "arm64"
          file "Larkite.app/Contents/MacOS/Larkite" | grep -q "x86_64"
          echo "==> Larkite.app Universal 2 (arm64 + x86_64) bundle successfully verified!"
